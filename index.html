<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANI | Location de Voitures</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --ink: #142033; --muted: #657184; --gold: #d5a84f; --paper: #f6f7f9; --white: #fff; --line: #e4e8ee; --green: #147d55; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: var(--paper); }
        a { color: inherit; text-decoration: none; }
        .inner { max-width: 1120px; margin: auto; display: grid; gap: 30px; padding: 0 20px; }
        header { background: #101a2a; color: white; padding: 17px 5px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .brand { font-size: 25px; font-weight: 900; letter-spacing: .4px; }
        .brand small { display: block; font-size: 10px; letter-spacing: 2px; color: #e3c37c; }
        .hero { padding: 60px 5%; background: linear-gradient(120deg, #111c2d 0%, #1b304a 65%, #24352 100%); color: white; }
        .hero-inner { max-width: 1120px; margin: auto; display: grid; grid-template-columns: 1.1fr .9fr; gap: 30px; align-items: center; }
        .eyebrow { color: #e3c37c; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; font-weight: bold; }
        .hero h1 { font-size: clamp(35px, 5vw, 58px); line-height: 1.04; margin: 14px 0; }
        .hero h1 span { color: #e3c37c; }
        .hero p { color: #d6deea; line-height: 1.7; max-width: 480px; }
        .search { background: white; border-radius: 12px; padding: 17px; display: grid; gap: 12px; margin-top: 25px; }
        .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 14px; }
        .btn { background: var(--gold); color: white; border: none; padding: 13px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { opacity: 0.9; }
        section { padding: 30px 5%; }
        .cars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .car-card { background: white; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .car-art { background: var(--paper); height: 120px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .car-body { padding: 15px; }
        .car-body h3 { margin: 0 0 10px 0; font-size: 18px; }
        .car-price { color: var(--gold); font-weight: bold; font-size: 16px; }
        .hidden { display: none; }
        @media(max-width: 760px) { .hero-inner { grid-template-columns: 1fr; } .cars-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
